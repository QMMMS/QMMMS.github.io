<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2090" viewBox="0 0 900 2090" role="img" aria-labelledby="title description">
<title id="title">Von 的标记读出与可选独立候选注意力</title>
<desc id="description">输入经 ModernBERT。展示全局注意力层的默认可见关系和 independent_options 掩码，两者为可选模式。独立模式重置候选位置编号。从同一个隐藏矩阵取各 MASK 行，经同一组 MLP 参数得到选项 logits。</desc>
