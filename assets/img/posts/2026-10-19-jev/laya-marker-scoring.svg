<rect x="425" y="35" width="100" height="62" rx="10" fill="#e2daf3" stroke="#b5a1d6" stroke-width="1.6"/>
<text x="475.0" y="66.0" font-size="22">[MASK]</text>
<rect x="525" y="35" width="120" height="62" rx="10" fill="#f3dfb9" stroke="#ddcda9" stroke-width="1.6"/>
<text x="585.0" y="66.0" font-size="22">选项 B</text>
<rect x="645" y="35" width="185" height="62" rx="10" fill="#f3dfb9" stroke="#ddcda9" stroke-width="1.6"/>
<text x="737.5" y="66.0" font-size="22">状态 s</text>
<path class="flow" d="M 450 97 V 155"/>
<rect x="240" y="155" width="420" height="58" rx="10" fill="#ead5f3" stroke="#d5b9e1" stroke-width="1.6"/>
