<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1950" viewBox="0 0 900 1950" role="img" aria-labelledby="title description">
<title id="title">Laya 的标记向量选取与共享评分器</title>
<desc id="description">决策头输出 L 行 d 列的 token 表示矩阵。根据输入 MASK 的位置 m1、m2，按行选取对应向量。两个向量分别通过同一组 LayerNorm、Linear d 到 d、GELU、Linear d 到 1 参数，得到两个 logits，再共同 softmax。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4b596b"/></marker>
  <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #283448; text-anchor: middle; dominant-baseline: middle; }
    .flow { fill: none; stroke: #4b596b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="900" height="1950" fill="#ffffff"/>
<rect x="70" y="35" width="135" height="62" rx="10" fill="#f3dfb9" stroke="#ddcda9" stroke-width="1.6"/>
<text x="137.5" y="66.0" font-size="22">问题</text>
<rect x="205" y="35" width="100" height="62" rx="10" fill="#ccebed" stroke="#79b9bc" stroke-width="1.6"/>
<text x="255.0" y="66.0" font-size="22">[MASK]</text>
<rect x="305" y="35" width="120" height="62" rx="10" fill="#f3dfb9" stroke="#ddcda9" stroke-width="1.6"/>
