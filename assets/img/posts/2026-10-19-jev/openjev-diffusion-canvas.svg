<text x="600.0" y="1642.5" font-size="26">Softmax</text>
<path class="flow" d="M 400 1675 V 1740"/>
<rect x="225" y="1740" width="350" height="85" rx="10" fill="#ccebed" stroke="#79b9bc" stroke-width="1.6"/>
