<text x="235" y="1499" font-size="22">q2 / m₂</text>
<text x="390" y="1499" font-size="23">…</text>
<text x="490" y="1499" font-size="23">ℓ_A</text>
<text x="610" y="1499" font-size="23">ℓ_B</text>
<text x="730" y="1499" font-size="23">…</text>
<text x="840" y="1499" font-size="23">ℓ_yes</text>
<text x="965" y="1499" font-size="23">ℓ_no</text>
<path d="M 550 1462 V 1570 H 400 V 1610" fill="none" stroke="#397f84" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 900 1520 V 1570 H 800 V 1610" fill="none" stroke="#8064ae" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
