<rect x="435" y="649" width="31" height="22" rx="3" fill="white" stroke="#ddcda9" stroke-width="1.2"/>
<rect x="482" y="649" width="31" height="22" rx="3" fill="white" stroke="#ddcda9" stroke-width="1.2"/>
<rect x="529" y="649" width="31" height="22" rx="3" fill="white" stroke="#ddcda9" stroke-width="1.2"/>
<rect x="576" y="649" width="31" height="22" rx="3" fill="white" stroke="#ddcda9" stroke-width="1.2"/>
<text x="651" y="660" font-size="22">…</text>
<path d="M 210 497 H 202 V 688 H 210 M 690 497 H 698 V 688 H 690" fill="none" stroke="#65748a" stroke-width="2"/>
<path d="M 215 520 H 95 V 775 H 220 V 825" fill="none" stroke="#397f84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 215 590 H 140 V 750 H 450 V 825" fill="none" stroke="#8064ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 685 660 H 810 V 780 H 730 V 825" fill="none" stroke="#a17b35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="120" y="825" width="200" height="58" rx="10" fill="#ccebed" stroke="#79b9bc" stroke-width="1.6"/>
