<path d="M 220 883 V 1130" fill="none" stroke="#397f84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 450 883 V 1130" fill="none" stroke="#8064ae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="125" y="1010" width="420" height="50" rx="10" fill="#d6e1f7" stroke="#bbcce9" stroke-width="1.6"/>
<text x="335.0" y="1035.0" font-size="22">Linear d → dₚ   ·   Wₖ, bₖ</text>
<rect x="630" y="955" width="200" height="125" rx="10" fill="#d6e1f7" stroke="#bbcce9" stroke-width="1.6"/>
<text x="730" y="981" font-size="24">Q 投影</text>
<text x="730" y="1020" font-size="21">Linear d → dₚ</text>
<text x="730" y="1050" font-size="21">Wq, bq</text>
<path class="flow" d="M 730 883 V 955"/>
<path class="flow" d="M 730 1080 V 1130"/>
<rect x="130" y="1130" width="180" height="55" rx="10" fill="#ccebed" stroke="#79b9bc" stroke-width="1.6"/>
<text x="220.0" y="1157.5" font-size="27">k₁</text>
<path class="flow" d="M 220 1185 V 1260"/>
<rect x="360" y="1130" width="180" height="55" rx="10" fill="#e2daf3" stroke="#b5a1d6" stroke-width="1.6"/>
