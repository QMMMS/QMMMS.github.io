<rect x="65" y="910" width="800" height="520" rx="10" fill="#f0f2f6" stroke="#c4ccd7" stroke-width="1.6"/>
<text x="590" y="933" font-size="24">指针评分头</text>
<rect x="100" y="955" width="470" height="125" rx="10" fill="#d6e1f7" stroke="#bbcce9" stroke-width="1.6"/>
