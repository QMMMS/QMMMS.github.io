<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1750" viewBox="0 0 900 1750" role="img" aria-labelledby="title description">
<title id="title">Kev 的候选位置指针读出</title>
<desc id="description">单个问题：骨干输出全部 token 隐藏表示，从两个选项结束标记和最后决策标记位置取出三行。两个候选向量经过同一个 K 投影，决策向量经过 Q 投影，缩放点积产生选项 logits，随后 softmax。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4b596b"/></marker>
  <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #283448; text-anchor: middle; dominant-baseline: middle; }
    .flow { fill: none; stroke: #4b596b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="900" height="1750" fill="#ffffff"/>
<rect x="35" y="35" width="110" height="62" rx="10" fill="#f3dfb9" stroke="#ddcda9" stroke-width="1.6"/>
<text x="90.0" y="66.0" font-size="21">状态 s</text>
<rect x="145" y="35" width="110" height="62" rx="10" fill="#f3dfb9" stroke="#ddcda9" stroke-width="1.6"/>
<text x="200.0" y="66.0" font-size="21">问题</text>
<rect x="255" y="35" width="110" height="62" rx="10" fill="#f3dfb9" stroke="#ddcda9" stroke-width="1.6"/>
<text x="310.0" y="66.0" font-size="21">选项 A</text>
<rect x="365" y="35" width="100" height="62" rx="10" fill="#ccebed" stroke="#79b9bc" stroke-width="1.6"/>
<text x="415.0" y="66.0" font-size="21">&lt;/opt&gt;</text>
<rect x="465" y="35" width="110" height="62" rx="10" fill="#f3dfb9" stroke="#ddcda9" stroke-width="1.6"/>
<text x="520.0" y="66.0" font-size="21">选项 B</text>
<rect x="575" y="35" width="100" height="62" rx="10" fill="#e2daf3" stroke="#b5a1d6" stroke-width="1.6"/>
<text x="625.0" y="66.0" font-size="21">&lt;/opt&gt;</text>
<rect x="675" y="35" width="190" height="62" rx="10" fill="#f3dfb9" stroke="#ddcda9" stroke-width="1.6"/>
<text x="770.0" y="66.0" font-size="21">&lt;decide&gt;</text>
<path class="flow" d="M 450 97 V 150"/>
<rect x="240" y="150" width="420" height="58" rx="10" fill="#ead5f3" stroke="#d5b9e1" stroke-width="1.6"/>
<text x="450.0" y="179.0" font-size="24">Token embedding</text>
<path class="flow" d="M 450 208 V 260"/>
<rect x="170" y="260" width="560" height="90" rx="10" fill="#f0f2f6" stroke="#c4ccd7" stroke-width="1.6"/>
<text x="450.0" y="305.0" font-size="27">预训练 Qwen 骨干</text>
<path class="flow" d="M 450 350 V 420"/>
<rect x="190" y="420" width="520" height="310" rx="10" fill="#f0f2f6" stroke="#c4ccd7" stroke-width="1.6"/>
<text x="450" y="450" font-size="23">H ∈ ℝᴸˣᵈ：各 token 的隐藏向量</text>
<text x="450" y="483" font-size="26">⋮</text>
<rect x="215" y="500" width="470" height="40" rx="10" fill="#ccebed" stroke="#79b9bc" stroke-width="1.6"/>
